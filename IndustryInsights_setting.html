<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行业洞察 · 洞察配置</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c18;
  --surface: #0f1729;
  --surface2: #131d30;
  --border: #1e2d4a;
  --border2: #253550;
  --blue: #3b82f6;
  --text1: #e2e8f0;
  --text2: #94a3b8;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--text1);
  height: 100vh;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 24px;
}
.btn-back {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-back:hover { color: var(--text1); }
.btn-primary {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 20px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.85; }
</style>
</head>
<body>

<button class="btn-back" onclick="window.location.href='IndustryInsights_list.html'">← 返回列表</button>
<button class="btn-primary" onclick="window.location.href='IndustryInsights_progress.html'">
  开始抽取
  <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h10M9 4l4 4-4 4"/></svg>
</button>

</body>
</html>
