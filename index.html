<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本体智见平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ── 变量（与 main.html 完全一致）── */
:root {
  --bg: #080c18;
  --sidebar-bg: #0d1220;
  --surface: #0f1729;
  --surface2: #131d30;
  --surface3: #1a2540;
  --border: #1e2d4a;
  --border2: #253550;
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,0.15);
  --purple: #8b5cf6;
  --purple-dim: rgba(139,92,246,0.15);
  --green: #10b981;
  --green-dim: rgba(16,185,129,0.12);
  --amber: #f59e0b;
  --amber-dim: rgba(245,158,11,0.12);
  --rose: #f43f5e;
  --text1: #e2e8f0;
  --text2: #94a3b8;
  --text3: #475569;
  --grad1: linear-gradient(135deg, #3b82f6, #8b5cf6);
  --grad2: linear-gradient(135deg, #06b6d4, #3b82f6);
  --grad3: linear-gradient(135deg, #8b5cf6, #ec4899);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--text1);
  height: 100vh;
  overflow: hidden;
  display: flex;
}

/* ── 侧边栏 ── */
.sidebar {
  width: 200px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}
/* 自定义滚动条 */
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb {
  background: var(--border2);
  border-radius: 2px;
}
.sidebar::-webkit-scrollbar-thumb:hover { background: var(--text3); }

.logo {
  padding: 18px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.logo-text { font-size: 14px; font-weight: 700; color: var(--text1); }

.nav-section { padding: 12px 0; }

.nav-label {
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 0 16px;
  margin-bottom: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all 0.15s;
}
.nav-item:hover { background: var(--surface); color: var(--text1); }
.nav-item.active {
  background: var(--blue-dim);
  color: var(--blue);
  border-left-color: var(--blue);
}

/* 二级导航 */
.nav-sub-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px 6px 38px;
  font-size: 11px;
  color: var(--text3);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all 0.15s;
}
.nav-sub-item:hover { background: var(--surface); color: var(--text2); }
.nav-sub-item.active {
  background: var(--blue-dim);
  color: var(--blue);
  border-left-color: var(--blue);
}
.nav-sub-dot { width: 4px; height: 4px; border-radius: 50%; background: currentColor; flex-shrink: 0; opacity: 0.5; }
.nav-sub-item.active .nav-sub-dot { opacity: 1; }

.nav-icon { width: 14px; height: 14px; opacity: 0.7; flex-shrink: 0; }
.nav-item.active .nav-icon { opacity: 1; }

.sidebar-bottom {
  margin-top: auto;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}
.user-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text2);
}
.avatar {
  width: 24px; height: 24px;
  background: var(--grad1);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: #fff;
  flex-shrink: 0;
}

.btn-settings {
  margin-left: auto;
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  background: transparent;
  border: none;
  border-radius: 6px;
  color: var(--text-3);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-settings svg { width: 14px; height: 14px; }
.btn-settings:hover { background: var(--surface); color: var(--text-1); }

/* ── 设置抽屉（覆盖左侧边栏） ── */
.settings-drawer {
  position: absolute;
  inset: 0;
  width: 200px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 100;
  transform: translateX(-100%);
  opacity: 0;
  visibility: hidden;
  transition: transform 0.2s ease, opacity 0.2s ease, visibility 0.2s;
}
.settings-drawer.open {
  transform: translateX(0);
  opacity: 1;
  visibility: visible;
}
.settings-drawer-top {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.settings-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  transition: color 0.15s;
  background: transparent;
  border: none;
  padding: 0;
}
.settings-back:hover { color: var(--text1); }
.settings-back svg { width: 14px; height: 14px; }
.settings-drawer-label {
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 12px 16px 4px;
}
.settings-drawer-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all 0.15s;
}
.settings-drawer-item:hover { background: var(--surface); color: var(--text1); }
.settings-drawer-item.active {
  background: var(--blue-dim);
  color: var(--blue);
  border-left-color: var(--blue);
}
.settings-drawer-item svg {
  width: 14px; height: 14px;
  opacity: 0.8;
  flex-shrink: 0;
}
.settings-drawer-item.active svg { opacity: 1; }

/* ── 主区域 ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}


/* ── iframe 内容区 ── */
.content-frame {
  flex: 1;
  min-height: 0;
  border: none;
  width: 100%;
  background: var(--bg);
  /* transition 已去除：本地文件加载极快，opacity 过渡反而产生 race condition */
}

/* ── 全屏转场动效：跳转 Arrange_white.html 时播放 ── */
#fullscreen-transition {
  position: fixed;
  inset: 0;
  background-color: #0a0a0c;
  z-index: 99999;
  display: none;
  justify-content: center;
  align-items: center;
  opacity: 0;
  transition: opacity 0.3s ease;
}
#fullscreen-transition.active {
  display: flex;
  opacity: 1;
}
#fs-stage-3d {
  perspective: 1200px;
  transform-style: preserve-3d;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}
/* 流光球体舞台 */
#fs-orb-stage {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 32px;
  z-index: 20;
  transform: translateZ(300px);
  transform-style: preserve-3d;
  pointer-events: none;
}
#fs-orb-stage.active {
  display: flex;
  animation: fsOrbStageIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
#fs-orb-stage.fade-out {
  animation: fsOrbStageOut 0.25s ease forwards;
}
#fs-orb {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  position: relative;
  background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e0e7ff 25%, #6366f1 60%, #312e81 100%);
  box-shadow:
    0 0 40px rgba(99, 102, 241, 0.45),
    0 0 80px rgba(99, 102, 241, 0.25),
    inset 0 0 30px rgba(255, 255, 255, 0.35);
  animation: fsOrbFloat 2.2s ease-in-out infinite;
}
#fs-orb::before,
#fs-orb::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  inset: -12px;
  border: 2px solid transparent;
  border-top-color: rgba(165, 180, 252, 0.9);
  border-right-color: rgba(99, 102, 241, 0.6);
  animation: fsOrbSpin 1.6s linear infinite;
}
#fs-orb::after {
  inset: -24px;
  border-top-color: rgba(199, 210, 254, 0.5);
  border-right-color: rgba(129, 140, 248, 0.35);
  animation-duration: 2.4s;
  animation-direction: reverse;
}
#fs-orb-glow {
  position: absolute;
  inset: -40%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(99, 102, 241, 0) 70%);
  animation: fsOrbPulse 2s ease-in-out infinite;
  pointer-events: none;
}
#fs-progress-track {
  width: 180px;
  height: 4px;
  background-color: rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: 0 0 12px rgba(99, 102, 241, 0.2);
}
#fs-progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #818cf8, #c7d2fe, #ffffff, #818cf8);
  background-size: 200% 100%;
  border-radius: 999px;
  box-shadow: 0 0 12px rgba(165, 180, 252, 0.8);
}
#fs-progress-bar.fs-fill {
  animation:
    fsFillBar 0.74s linear forwards,
    fsShimmer 1.1s linear infinite;
}
#fs-progress-text {
  font-size: 11px;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 0.12em;
  margin-top: -20px;
  text-transform: uppercase;
}
#fs-matrix-grid {
  position: absolute;
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  width: 104vw;
  height: 104vh;
  transform-style: preserve-3d;
  display: none;
  z-index: 10;
}
.fs-cube-mesh {
  background-color: #ffffff;
  border: 0.5px solid #ffffff;
  position: relative;
  transform-style: preserve-3d;
  opacity: 0;
  transform: scale(0) translateZ(0);
}
.fs-cube-mesh::after {
  content: '';
  position: absolute;
  inset: 0;
  background-color: #f0f2f5;
  transform: translateZ(-5px);
  pointer-events: none;
}
.fs-cube-mesh.animating {
  animation: fsCubePopAndDrop 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}
@keyframes fsOrbStageIn {
  0% { transform: scale(0.6) translateZ(0); opacity: 0; }
  100% { transform: scale(1) translateZ(300px); opacity: 1; }
}
@keyframes fsOrbStageOut {
  0% { transform: scale(1) translateZ(300px); opacity: 1; }
  100% { transform: scale(0.85) translateZ(350px); opacity: 0; }
}
@keyframes fsOrbFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
@keyframes fsOrbSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
@keyframes fsOrbPulse {
  0%, 100% { transform: scale(1); opacity: 0.8; }
  50% { transform: scale(1.15); opacity: 1; }
}
@keyframes fsFillBar {
  to { width: 100%; }
}
@keyframes fsShimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}
@keyframes fsCubePopAndDrop {
  0% {
    transform: scale(0) translateZ(0);
    opacity: 0;
    box-shadow: 0 0 0 rgba(0,0,0,0);
  }
  15% { opacity: 1; }
  45% {
    transform: scale(1.15) translateZ(160px);
    box-shadow: 0 35px 45px rgba(0, 0, 0, 0.3);
  }
  90%, 100% {
    transform: scale(1.02) translateZ(0px);
    opacity: 1;
    box-shadow: 0 0 0 rgba(0,0,0,0);
  }
}

/* ── Toast 提示 ── */
.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--surface3);
  border: 1px solid var(--border2);
  color: var(--text1);
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 12px;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.2s;
  pointer-events: none;
  z-index: 9999;
}
.toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>

  <!-- 内容 iframe -->
  <iframe
    id="content-frame"
    class="content-frame"
    src="main.html"
    allowfullscreen>
  </iframe>
</div>

<!-- 全屏转场动效容器（跳转 Arrange_white.html 时播放） -->
<div id="fullscreen-transition" aria-hidden="true">
  <div id="fs-stage-3d">
    <div id="fs-orb-stage">
      <div id="fs-orb">
        <div id="fs-orb-glow"></div>
      </div>
      <div id="fs-progress-track">
        <div id="fs-progress-bar"></div>
      </div>
      <div id="fs-progress-text">Loading</div>
    </div>
    <div id="fs-matrix-grid"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── 路由配置 ──────────────────────────────────
// 每个导航项对应：加载哪个文件、传什么 page 参数、面包屑显示什么
const NAV_MAP = {
  'nav-home':           { file: 'main.html',          page: 'home',           crumbs: ['概览', '主页'] },
  'nav-tc':             { file: 'main.html',          page: 'tc-list',        crumbs: ['任务中心'] },
  'nav-ke':             { file: 'main.html',          page: 'ke-tasks',       crumbs: ['知识抽取与融合', '抽取任务'] },
  'nav-global-library': { file: 'main.html',          page: 'global-library', crumbs: ['知识工厂', '文献库'] },
  'nav-onto-overview':  { file: 'ontology_overview.html',    page: null, crumbs: ['本体中心'] },
  'nav-onto-element':  { file: 'graph_list.html',         page: null, crumbs: ['本体中心', '要素本体'] },
  'nav-onto-causal':   { file: 'graph_list_causal.html',  page: null, crumbs: ['本体中心', '因果本体'] },
  'nav-biz':            { file: 'arrange_select.html', page: null,             crumbs: ['业务本体生成'] },
  'nav-industry-v2':      { file: 'IndustryInsights_list.html', page: null, crumbs: ['行业洞察'] },
  'nav-industry':         { file: 'data_explorer.html',         page: null, crumbs: ['备份', '行业洞察（旧版备份）'] },
  'nav-setting-backup':   { file: 'setting_backup.html',        page: null, crumbs: ['备份', '数据分析设置'] },
  'nav-rag':              { file: 'RAGrule_list.html',          page: null, crumbs: ['RAG增强管理'] },
  'nav-system-setting':   { file: 'system_setting.html',        page: null, crumbs: ['系统设置'] },
};

let currentFile = 'main.html';
let currentPage = null;
let toastTimer = null;
let lastNavBeforeSettings = null; // 打开设置抽屉前记住当前页面，关闭后恢复

// ── 设置抽屉 ──────────────────────────────────
function openSettingsDrawer() {
  lastNavBeforeSettings = {
    file: currentFile,
    page: currentPage,
    activeId: document.querySelector('.nav-item.active, .nav-sub-item.active')?.id || ''
  };
  document.getElementById('settings-drawer').classList.add('open');
  // 打开抽屉的同时默认进入全局参数配置
  goToSettingSection('params');
}

function closeSettingsDrawer() {
  document.getElementById('settings-drawer').classList.remove('open');
  // 返回到进入设置前的页面
  if (lastNavBeforeSettings) {
    navigate(lastNavBeforeSettings.file, lastNavBeforeSettings.page, []);
  }
}

function goToSettingSection(section) {
  // 更新抽屉内高亮
  document.querySelectorAll('.settings-drawer-item').forEach(el => el.classList.remove('active'));
  document.querySelector('.settings-drawer-item[data-section="' + section + '"]').classList.add('active');

  // 加载设置页面并传递 section 参数
  const frame = document.getElementById('content-frame');
  if (currentFile !== 'system_setting.html') {
    frame.style.opacity = '0';
    frame.src = 'system_setting.html?section=' + section;
    currentFile = 'system_setting.html';
    frame.onload = function() {
      frame.style.opacity = '1';
      frame.onload = null;
    };
  } else {
    frame.contentWindow.postMessage({ type: 'GOTO_SETTING_SECTION', section: section }, '*');
  }
}

// 是否需要全屏展示的白色编排页集合
const FULLSCREEN_FILES = new Set([
  'Arrange_white.html'
]);

// ── 核心导航函数 ──────────────────────────────
function navigate(file, page, crumbs) {
  const frame = document.getElementById('content-frame');
  const sidebar = document.querySelector('.sidebar');

  if (file !== currentFile) {
    // 切换文件时先将 iframe 隐藏，避免看到旧页面或 main.html 默认首页的闪烁
    frame.style.opacity = '0';
    // main.html 支持 ?page= 参数在 DOMContentLoaded 时直接定位目标子页面
    frame.src = (file === 'main.html' && page) ? `${file}?page=${page}` : file;
    currentFile = file;
    currentPage = page;
    frame.onload = function() {
      // URL 参数路由已在 DOMContentLoaded 中处理，无需再发 sendPageCmd
      // （发了反而会触发 goPage 二次调用，产生闪烁）
      frame.style.opacity = '1';
      frame.onload = null;
    };
  } else {
    // 同一文件内切换页面，直接发消息
    currentPage = page;
    if (page) sendPageCmd(page);
  }

  // 全屏页面：隐藏左侧侧边栏，iframe 占满整屏
  if (FULLSCREEN_FILES.has(file)) {
    if (sidebar) sidebar.style.display = 'none';
    frame.style.width = '100vw';
    frame.style.position = 'absolute';
    frame.style.left = '0';
    frame.style.top = '0';
    frame.style.height = '100vh';
    frame.style.zIndex = '100';
  } else {
    if (sidebar) sidebar.style.display = '';
    frame.style.width = '';
    frame.style.position = '';
    frame.style.left = '';
    frame.style.top = '';
    frame.style.height = '';
    frame.style.zIndex = '';
  }

  // 更新导航高亮
  document.querySelectorAll('.nav-item, .nav-sub-item').forEach(n => n.classList.remove('active'));
  Object.entries(NAV_MAP).forEach(([navId, config]) => {
    if (config.file === file && config.page === page) {
      const el = document.getElementById(navId);
      if (el) el.classList.add('active');
    }
  });

  // 切换其他页面时自动关闭设置抽屉
  if (file !== 'system_setting.html') {
    document.getElementById('settings-drawer').classList.remove('open');
  }
}

// ── 向 iframe 发送页面切换指令 ────────────────
function sendPageCmd(page) {
  const frame = document.getElementById('content-frame');
  frame.contentWindow.postMessage({ type: 'GOTO', page: page }, '*');
}

// ── 全屏 3D 纯白矩阵转场 ───────────────────────
const FS_GRID_SIZE = 8;
let fsTransitionTarget = '';

function initFSMatrix() {
  const grid = document.getElementById('fs-matrix-grid');
  grid.innerHTML = '';
  const center = (FS_GRID_SIZE - 1) / 2;
  const maxDistance = Math.hypot(center, center);
  for (let r = 0; r < FS_GRID_SIZE; r++) {
    for (let c = 0; c < FS_GRID_SIZE; c++) {
      const cube = document.createElement('div');
      cube.className = 'fs-cube-mesh';
      const distance = Math.hypot(r - center, c - center);
      const delay = (distance / maxDistance) * 0.22;
      cube.style.animationDelay = `${delay}s`;
      grid.appendChild(cube);
    }
  }
}

function playFullscreenTransition(targetUrl) {
  fsTransitionTarget = targetUrl;
  const container = document.getElementById('fullscreen-transition');
  const orbStage = document.getElementById('fs-orb-stage');
  const matrixGrid = document.getElementById('fs-matrix-grid');
  const progressBar = document.getElementById('fs-progress-bar');

  // 重置舞台
  container.style.display = 'flex';
  void container.offsetWidth; // 触发 reflow
  container.classList.add('active');
  orbStage.classList.remove('active', 'fade-out');
  orbStage.style.display = 'none';
  orbStage.style.opacity = '';
  matrixGrid.style.display = 'none';
  progressBar.classList.remove('fs-fill');

  initFSMatrix();

  // 第一阶段：流光球体 + 进度条入场
  orbStage.style.display = 'flex';
  void orbStage.offsetWidth;
  orbStage.classList.add('active');
  progressBar.classList.add('fs-fill');

  // 第二阶段：矩阵在球体后方爆发
  setTimeout(() => {
    matrixGrid.style.display = 'grid';
    matrixGrid.querySelectorAll('.fs-cube-mesh').forEach(cube => {
      void cube.offsetWidth;
      cube.classList.add('animating');
    });
  }, 250);

  // 第三阶段：方块拍平前将球体淡出，随后执行顶层全屏跳转
  setTimeout(() => {
    orbStage.classList.add('fade-out');
    setTimeout(() => {
      window.top.location.href = fsTransitionTarget;
    }, 250);
  }, 740);
}

// ── 监听 iframe 内部的页面切换消息 ───────────
window.addEventListener('message', function(e) {
  if (!e.data) return;

  // 子页面通过 components.js 自动上报文件名，同步 currentFile
  // 解决 location.href 内部跳转后侧边栏无响应的问题
  if (e.data.type === 'IFRAME_NAVIGATED') {
    currentFile = e.data.file;
    return;
  }

  // 子页面请求 Shell 代为导航（避免 iframe 内部 location.href 绕过 opacity 遮罩）
  if (e.data.type === 'NAVIGATE_TO') {
    const target = e.data.file || '';
    // 跳转到需要全屏展示的白色编排页时，先播放 3D 纯白矩阵转场，再顶层跳转
    if (target.split('?')[0] === 'Arrange_white.html') {
      playFullscreenTransition(target);
      return;
    }
    navigate(e.data.file, e.data.page || null, e.data.crumbs || []);
    return;
  }

  // 设置页请求关闭抽屉并返回原页面
  if (e.data.type === 'CLOSE_SETTINGS') {
    closeSettingsDrawer();
    return;
  }

  if (e.data.type !== 'NAV') return;
  // 同步侧边栏高亮
  if (e.data.navId) {
    document.querySelectorAll('.nav-item, .nav-sub-item').forEach(n => n.classList.remove('active'));
    const el = document.getElementById(e.data.navId);
    if (el) el.classList.add('active');
  }
});

// ── Toast 提示 ────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── 初始化：首次加载 main.html，page-home 默认已有 active 类，无需 sendPageCmd
// （调用 sendPageCmd 反而会触发 goPage 二次执行，造成闪烁）
document.getElementById('content-frame').onload = function() {
  this.onload = null;
};

// ── 从 Arrange_white.html 全屏返回时，恢复 Shell iframe 到来源页 ──
(function recoverFromFullscreen() {
  const params = new URLSearchParams(window.location.search);
  const recoverFile = params.get('recoverIframe');
  if (!recoverFile) return;
  // 清理 URL，避免刷新后重复触发
  if (window.history.replaceState) {
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  // 延迟一帧导航，确保 iframe 已经初始化
  requestAnimationFrame(() => {
    setTimeout(() => {
      if (recoverFile === 'main.html') {
        navigate('main.html', 'home', ['概览', '主页']);
      } else {
        // 其它页面直接在 iframe 内加载
        navigate(recoverFile, null, []);
      }
    }, 0);
  });
})();
</script>
</body>
</html>
