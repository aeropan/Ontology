<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本体智见平台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ── 变量（与 main.html 完全一致）── */
:root {
  --bg: #080c18;
  --sidebar-bg: #0d1220;
  --surface: #0f1729;
  --surface2: #131d30;
  --surface3: #1a2540;
  --border: #1e2d4a;
  --border2: #253550;
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,0.15);
  --purple: #8b5cf6;
  --purple-dim: rgba(139,92,246,0.15);
  --green: #10b981;
  --green-dim: rgba(16,185,129,0.12);
  --amber: #f59e0b;
  --amber-dim: rgba(245,158,11,0.12);
  --rose: #f43f5e;
  --text1: #e2e8f0;
  --text2: #94a3b8;
  --text3: #475569;
  --grad1: linear-gradient(135deg, #3b82f6, #8b5cf6);
  --grad2: linear-gradient(135deg, #06b6d4, #3b82f6);
  --grad3: linear-gradient(135deg, #8b5cf6, #ec4899);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--text1);
  height: 100vh;
  overflow: hidden;
  display: flex;
}

/* ── 侧边栏 ── */
.sidebar {
  width: 200px;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}

.logo {
  padding: 18px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.logo-text { font-size: 14px; font-weight: 700; color: var(--text1); }

.nav-section { padding: 12px 0; }

.nav-label {
  font-size: 9px;
  color: var(--text3);
  letter-spacing: 2px;
  text-transform: uppercase;
  padding: 0 16px;
  margin-bottom: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  font-size: 12px;
  color: var(--text2);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all 0.15s;
}
.nav-item:hover { background: var(--surface); color: var(--text1); }
.nav-item.active {
  background: var(--blue-dim);
  color: var(--blue);
  border-left-color: var(--blue);
}

.nav-icon { width: 14px; height: 14px; opacity: 0.7; flex-shrink: 0; }
.nav-item.active .nav-icon { opacity: 1; }

.sidebar-bottom {
  margin-top: auto;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
}
.user-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: var(--text2);
}
.avatar {
  width: 24px; height: 24px;
  background: var(--grad1);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; color: #fff;
  flex-shrink: 0;
}

/* ── 主区域 ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* ── 顶部栏 ── */
.topbar {
  height: 48px;
  background: var(--sidebar-bg);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  flex-shrink: 0;
  gap: 8px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text2);
}
.breadcrumb .current { color: var(--text1); font-weight: 500; }
.breadcrumb .sep { color: var(--text3); }
.topbar-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}
.icon-btn {
  width: 28px; height: 28px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  cursor: pointer;
  color: var(--text2);
  transition: all 0.15s;
}
.icon-btn:hover { background: var(--surface); color: var(--text1); }

/* ── iframe 内容区 ── */
.content-frame {
  flex: 1;
  min-height: 0;
  border: none;
  width: 100%;
  background: var(--bg);
}

/* ── Toast 提示 ── */
.toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: var(--surface3);
  border: 1px solid var(--border2);
  color: var(--text1);
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 12px;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.2s;
  pointer-events: none;
  z-index: 9999;
}
.toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<!-- ── 侧边栏 ── -->
<div class="sidebar">
  <div class="logo" onclick="navigate('main.html', 'home', ['概览','主页'])">
    <div style="display:flex;align-items:center;justify-content:flex-start;">
      <img src="logo.png" alt="平台Logo" style="height:32px;width:auto;object-fit:contain;"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div style="display:none;width:28px;height:28px;background:var(--grad1);border-radius:6px;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;">本</div>
    </div>
    <div class="logo-text">本体智见</div>
  </div>

  <div class="nav-section">
    <div class="nav-label">概览</div>
    <div class="nav-item active" id="nav-home" onclick="navigate('main.html', 'home', ['概览','主页'])">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 7l7-5 7 5v7a1 1 0 01-1 1H2a1 1 0 01-1-1V7z"/><path d="M6 15V9h4v6"/></svg>
      主页
    </div>
    <div class="nav-item" id="nav-tc" onclick="navigate('main.html', 'tc-list', ['任务中心'])">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
      任务中心
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label">知识工厂</div>
    <div class="nav-item" id="nav-ke" onclick="navigate('main.html', 'ke-tasks', ['知识抽取与融合','抽取任务'])">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h10M3 8h7M3 12h5"/><circle cx="12" cy="11" r="2.5"/></svg>
      知识抽取与融合
    </div>
    <div class="nav-item" id="nav-global-library" onclick="navigate('main.html', 'global-library', ['知识工厂','文献库'])">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3a1 1 0 011-1h10a1 1 0 011 1v10a1 1 0 01-1 1H3a1 1 0 01-1-1V3z"/><path d="M5 6h6M5 10h4"/></svg>
      文献库
    </div>
    <div class="nav-item" id="nav-onto" onclick="navigate('main.html', 'onto-list', ['本体中心'])">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg>
      本体中心
    </div>
    <div class="nav-item" onclick="showToast('图谱管理模块建设中…')">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5" cy="8" r="2"/><circle cx="11" cy="4" r="2"/><circle cx="11" cy="12" r="2"/><path d="M7 8h2M7 7l2-2M7 9l2 2"/></svg>
      图谱管理
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label">服务中心</div>
    <div class="nav-item" id="nav-biz" onclick="navigate('main.html', 'biz-list', ['业务本体生成'])">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="4" width="5" height="5" rx="1"/><rect x="10" y="4" width="5" height="5" rx="1"/><path d="M6 6.5h4M8 4V2M8 9v2.5M4 11.5c0 1 .5 2 2 2h4c1.5 0 2-1 2-2"/></svg>
      业务本体生成
    </div>
    <div class="nav-item" id="nav-industry-v2" onclick="navigate('IndustryInsights_list.html', null, ['行业洞察'])">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="10" width="4" height="5" rx="0.5"/><rect x="6" y="6" width="4" height="9" rx="0.5"/><rect x="11" y="2" width="4" height="13" rx="0.5"/></svg>
      行业洞察
    </div>
    <div class="nav-item" onclick="showToast('API管理模块建设中…')">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 3h10v2H3zM3 7h7v2H3zM3 11h5v2H3z"/></svg>
      API管理
    </div>
  </div>

  <div class="nav-section">
    <div class="nav-label">备份</div>
    <div class="nav-item" id="nav-industry" onclick="navigate('data_explorer.html', null, ['备份', '行业洞察（旧版备份）'])">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="10" width="4" height="5" rx="0.5"/><rect x="6" y="6" width="4" height="9" rx="0.5"/><rect x="11" y="2" width="4" height="13" rx="0.5"/></svg>
      行业洞察（旧版备份）
    </div>
    <div class="nav-item" id="nav-setting-backup" onclick="navigate('setting_backup.html', null, ['备份', '数据分析设置'])">
      <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="2.5"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.22 3.22l1.42 1.42M11.36 11.36l1.42 1.42M3.22 12.78l1.42-1.42M11.36 4.64l1.42-1.42"/></svg>
      数据分析设置
    </div>
  </div>

  <div class="sidebar-bottom">
    <div class="user-row">
      <div class="avatar">工</div>
      <span>图谱工程师</span>
    </div>
  </div>
</div>

<!-- ── 主区域 ── -->
<div class="main">
  <!-- 顶部栏 -->
  <div class="topbar">
    <div class="breadcrumb" id="breadcrumb">
      <span class="current">主页</span>
    </div>
    <div class="topbar-actions">
      <div class="icon-btn" title="通知">🔔</div>
      <div class="icon-btn" title="设置">⚙</div>
    </div>
  </div>

  <!-- 内容 iframe -->
  <iframe
    id="content-frame"
    class="content-frame"
    src="main.html"
    allowfullscreen>
  </iframe>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── 路由配置 ──────────────────────────────────
// 每个导航项对应：加载哪个文件、传什么 page 参数、面包屑显示什么
const NAV_MAP = {
  'nav-home':           { file: 'main.html',          page: 'home',           crumbs: ['概览', '主页'] },
  'nav-tc':             { file: 'main.html',          page: 'tc-list',        crumbs: ['任务中心'] },
  'nav-ke':             { file: 'main.html',          page: 'ke-tasks',       crumbs: ['知识抽取与融合', '抽取任务'] },
  'nav-global-library': { file: 'main.html',          page: 'global-library', crumbs: ['知识工厂', '文献库'] },
  'nav-onto':           { file: 'main.html',          page: 'onto-list',      crumbs: ['本体中心'] },
  'nav-biz':            { file: 'main.html',          page: 'biz-list',       crumbs: ['业务本体生成'] },
  'nav-industry-v2':      { file: 'IndustryInsights_list.html', page: null, crumbs: ['行业洞察'] },
  'nav-industry':         { file: 'data_explorer.html',         page: null, crumbs: ['备份', '行业洞察（旧版备份）'] },
  'nav-setting-backup':   { file: 'setting_backup.html',        page: null, crumbs: ['备份', '数据分析设置'] },
};

let currentFile = 'main.html';
let toastTimer = null;

// ── 核心导航函数 ──────────────────────────────
function navigate(file, page, crumbs) {
  const frame = document.getElementById('content-frame');

  if (file !== currentFile) {
    // 切换到不同的文件
    frame.src = file;
    currentFile = file;
    // 等 iframe 加载完成后再传 page 指令
    frame.onload = function() {
      if (page) sendPageCmd(page);
      frame.onload = null;
    };
  } else {
    // 同一文件内切换页面，直接发消息
    if (page) sendPageCmd(page);
  }

  // 更新面包屑
  updateBreadcrumb(crumbs);

  // 更新导航高亮
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  // 找到对应的 nav-item 并高亮
  Object.entries(NAV_MAP).forEach(([navId, config]) => {
    if (config.file === file && config.page === page) {
      const el = document.getElementById(navId);
      if (el) el.classList.add('active');
    }
  });
}

// ── 向 iframe 发送页面切换指令 ────────────────
function sendPageCmd(page) {
  const frame = document.getElementById('content-frame');
  frame.contentWindow.postMessage({ type: 'GOTO', page: page }, '*');
}

// ── 更新面包屑 ────────────────────────────────
function updateBreadcrumb(crumbs) {
  const bc = document.getElementById('breadcrumb');
  bc.innerHTML = crumbs.map((c, i) =>
    i === crumbs.length - 1
      ? `<span class="current">${c}</span>`
      : `<span>${c}</span><span class="sep">›</span>`
  ).join('');
}

// ── 监听 iframe 内部的页面切换消息 ───────────
// main.html 内部跳转（如点击任务行进入详情）需要同步更新外部面包屑
window.addEventListener('message', function(e) {
  if (!e.data || e.data.type !== 'NAV') return;
  updateBreadcrumb(e.data.crumbs);

  // 同步侧边栏高亮
  if (e.data.navId) {
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    const el = document.getElementById(e.data.navId);
    if (el) el.classList.add('active');
  }
});

// ── Toast 提示 ────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── 初始化：加载完成后跳转首页 ───────────────
document.getElementById('content-frame').onload = function() {
  sendPageCmd('home');
  this.onload = null;
};
</script>
</body>
</html>
