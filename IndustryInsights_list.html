<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>行业洞察 · 列表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/shared.css">
<style>
body {
  min-height: 100vh;
  padding: 24px;
}

/* ── 页头 ── */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px;
}
.page-title { font-size: 18px; font-weight: 600; color: var(--text-1); }
.page-desc  { font-size: 12px; color: var(--text-3); margin-top: 3px; }
.header-actions { display: flex; align-items: center; gap: 10px; }
.btn-primary {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; background: var(--blue);
  color: #fff; border: none; border-radius: 8px;
  font-size: 13px; font-family: inherit; cursor: pointer; transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.85; }
.btn-secondary {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; background: transparent;
  color: var(--text-2); border: 1px solid var(--border-2); border-radius: 8px;
  font-size: 13px; font-family: inherit; cursor: pointer; transition: all 0.15s;
}
.btn-secondary:hover { border-color: var(--blue); color: var(--blue); }

/* ── 筛选栏 ── */
.filter-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.filter-input {
  flex: 1; max-width: 320px;
  background: var(--bg-2); border: 1px solid var(--border-1);
  border-radius: 8px; padding: 7px 12px;
  font-size: 12px; color: var(--text-1); font-family: inherit;
  outline: none; transition: border-color 0.15s;
}
.filter-input::placeholder { color: var(--text-3); }
.filter-input:focus { border-color: var(--blue); }
.filter-tag {
  padding: 5px 12px; border-radius: 6px; font-size: 11px;
  border: 1px solid var(--border-1); background: var(--bg-2);
  color: var(--text-2); cursor: pointer; transition: all 0.15s;
}
.filter-tag.active { border-color: var(--blue); color: var(--blue); background: var(--blue-dim); }

/* ── 卡片列表 ── */
.insight-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}
.insight-card {
  background: var(--bg-2); border: 1px solid var(--border-1);
  border-radius: 12px; padding: 18px; cursor: pointer;
  transition: all 0.15s; display: flex; flex-direction: column; gap: 12px;
}
.insight-card:hover { border-color: var(--blue); background: var(--bg-3); }
/* ── 顶部颜色条（按状态） ── */
.insight-card[data-status="done"]    { border-top: 4px solid var(--green); }
.insight-card[data-status="running"] { border-top: 4px solid var(--blue); }
.insight-card[data-status="draft"]   { border-top: 4px solid var(--amber); }
/* 悬停时保持顶部色（specificity 覆盖 hover 的 border-color shorthand） */
.insight-card[data-status="done"]:hover    { border-top-color: var(--green); }
.insight-card[data-status="running"]:hover { border-top-color: var(--blue); }
.insight-card[data-status="draft"]:hover   { border-top-color: var(--amber); }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.card-name { font-size: 14px; font-weight: 500; color: var(--text-1); line-height: 1.4; }
.status-badge { flex-shrink: 0; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 500; }
.status-done    { background: var(--green-dim); color: var(--green); }
.status-running { background: var(--blue-dim);  color: var(--blue); }
.status-draft   { background: var(--bg-4);  color: var(--text-3); }
.card-meta { display: flex; align-items: center; gap: 16px; font-size: 11px; color: var(--text-3); }
.card-meta span { display: flex; align-items: center; gap: 4px; }
.card-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 12px; border-top: 1px solid var(--border-1);
}
.card-footer-time { font-size: 11px; color: var(--text-3); }
.btn-detail {
  font-size: 11px; color: var(--blue); cursor: pointer;
  background: none; border: none; font-family: inherit; padding: 0;
}
.btn-detail:hover { text-decoration: underline; }

/* ══════════════════════════════════════════
   新建弹窗
══════════════════════════════════════════ */

.modal {
  background: var(--bg-3); border: 1px solid var(--border-2);
  border-radius: 16px; width: 500px; max-width: 92vw;
  box-shadow: 0 24px 64px rgba(0,0,0,0.5);
  display: flex; flex-direction: column;
  max-height: 90vh; overflow: hidden;
}

/* 弹窗顶栏 */
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 24px 0; flex-shrink: 0;
}
.modal-title { font-size: 15px; font-weight: 600; }
.modal-close {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer; color: var(--text-3);
  background: none; border: none; font-family: inherit; transition: all 0.15s;
}
.modal-close:hover { background: var(--bg-4); color: var(--text-1); }

/* 弹窗主体（可滚动） */
.modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }

/* 表单 */
.form-row { margin-bottom: 16px; }
.form-row:last-child { margin-bottom: 0; }
.form-label {
  display: block; font-size: 11px; color: var(--text-2);
  margin-bottom: 6px; letter-spacing: 0.5px;
}
.form-input, .form-select, .form-textarea {
  width: 100%; background: var(--bg-2);
  border: 1px solid var(--border-1); border-radius: 8px;
  padding: 9px 12px; font-size: 13px; color: var(--text-1);
  font-family: inherit; outline: none; transition: border-color 0.15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--blue); }
.form-input.error { border-color: var(--rose); }
.form-select option { background: var(--bg-3); }
.form-textarea { resize: vertical; min-height: 76px; line-height: 1.6; }

/* 弹窗底部 */
.modal-footer {
  display: flex; justify-content: flex-end; gap: 10px;
  padding: 16px 24px; border-top: 1px solid var(--border-1);
  flex-shrink: 0;
}
.btn-cancel {
  padding: 8px 16px; background: var(--bg-4);
  border: 1px solid var(--border-2); border-radius: 8px;
  font-size: 13px; font-family: inherit; color: var(--text-2);
  cursor: pointer; transition: all 0.15s;
}
.btn-cancel:hover { color: var(--text-1); }
</style>
</head>
<body>

<!-- ── 页头 ── -->
<div class="page-header">
  <div>
    <div class="page-title">行业洞察</div>
    <div class="page-desc">管理和查看所有行业洞察分析任务</div>
  </div>
  <div class="header-actions">
    <button class="btn-secondary" onclick="goTemplateList()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
      洞察模板
    </button>
    <button class="btn-primary" onclick="openModal()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v12M2 8h12"/></svg>
      新建洞察
    </button>
  </div>
</div>

<!-- ── 筛选栏 ── -->
<div class="filter-bar">
  <input class="filter-input" placeholder="搜索洞察任务…" oninput="filterCards(this.value)" />
  <span class="filter-tag active" onclick="setFilter(this,'all')">全部</span>
  <span class="filter-tag" onclick="setFilter(this,'done')">已完成</span>
  <span class="filter-tag" onclick="setFilter(this,'running')">进行中</span>
  <span class="filter-tag" onclick="setFilter(this,'draft')">草稿</span>
</div>

<!-- ── 卡片列表 ── -->
<div class="insight-grid" id="card-grid">
  <div class="insight-card" data-status="done" onclick="goDetail()">
    <div class="card-top">
      <div class="card-name">风电行业技术方法综合洞察</div>
      <span class="status-badge status-done">已完成</span>
    </div>
    <div class="card-meta">
      <span>
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12v10H2z"/><path d="M5 2v4M11 2v4M2 8h12"/></svg>
        ERA5 + SCADA
      </span>
      <span>
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg>
        2026-03-28
      </span>
    </div>
    <div class="card-footer">
      <span class="card-footer-time">最后更新：2小时前</span>
      <button class="btn-detail" onclick="event.stopPropagation();goDetail()">查看详情 →</button>
    </div>
  </div>

  <div class="insight-card" data-status="running">
    <div class="card-top">
      <div class="card-name">近海风场气象特征分析</div>
      <span class="status-badge status-running">进行中</span>
    </div>
    <div class="card-meta">
      <span>
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12v10H2z"/><path d="M5 2v4M11 2v4M2 8h12"/></svg>
        ERA5
      </span>
      <span>
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg>
        2026-04-01
      </span>
    </div>
    <div class="card-footer">
      <span class="card-footer-time">抽取中…</span>
      <button class="btn-detail" onclick="event.stopPropagation();goProgress()">查看进度 →</button>
    </div>
  </div>

  <div class="insight-card" data-status="draft">
    <div class="card-top">
      <div class="card-name">山地地形风速预测方法综述</div>
      <span class="status-badge status-draft">草稿</span>
    </div>
    <div class="card-meta">
      <span>
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12v10H2z"/><path d="M5 2v4M11 2v4M2 8h12"/></svg>
        待配置
      </span>
      <span>
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/><path d="M8 5v3l2 2"/></svg>
        2026-04-09
      </span>
    </div>
    <div class="card-footer">
      <span class="card-footer-time">未提交</span>
      <button class="btn-detail" onclick="event.stopPropagation();goSetting()">继续配置 →</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════════
     新建洞察弹窗
══════════════════════════════════════════ -->
<div class="modal-overlay" id="modal-mask" onclick="handleMaskClick(event)">
  <div class="modal" onclick="event.stopPropagation()">

    <!-- 顶栏 -->
    <div class="modal-header">
      <div class="modal-title">新建行业洞察</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>

    <!-- 主体 -->
    <div class="modal-body">
      <div class="form-row">
        <label class="form-label">洞察名称 <span style="color:var(--rose)">*</span></label>
        <input class="form-input" id="f-name" placeholder="为本次洞察任务起一个名称" />
      </div>
      <div class="form-row">
        <label class="form-label">行业领域 <span style="color:var(--rose)">*</span></label>
        <select class="form-select" id="f-industry">
          <option value="">请选择…</option>
          <option value="wind">风电</option>
          <option value="disaster">灾害预测</option>
          <option value="solar">光伏</option>
          <option value="hydro">水电</option>
        </select>
      </div>
      <div class="form-row">
        <label class="form-label">任务描述</label>
        <textarea class="form-textarea" id="f-desc" placeholder="简要描述本次洞察的目标与范围（选填）"></textarea>
      </div>
    </div><!-- /modal-body -->

    <!-- 底部按钮 -->
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-primary" onclick="submitNew()">
        下一步：上传文献 →
      </button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════
   新建弹窗
════════════════════════════ */
function openModal() {
  document.getElementById('modal-mask').classList.add('active');
}
function closeModal() {
  document.getElementById('modal-mask').classList.remove('active');
}
function handleMaskClick(e) {
  if (e.target === document.getElementById('modal-mask')) closeModal();
}

function submitNew() {
  const name = document.getElementById('f-name').value.trim();
  const industry = document.getElementById('f-industry').value;
  if (!name) {
    const inp = document.getElementById('f-name');
    inp.classList.add('error');
    inp.focus();
    inp.addEventListener('input', () => inp.classList.remove('error'), { once: true });
    return;
  }
  if (!industry) {
    document.getElementById('f-industry').focus();
    return;
  }
  closeModal();
  goSetting();
}

/* ════════════════════════════
   列表筛选
════════════════════════════ */
let currentFilter = 'all';
function setFilter(el, type) {
  currentFilter = type;
  document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  filterCards(document.querySelector('.filter-input').value);
}
function filterCards(keyword) {
  const kw = keyword.toLowerCase();
  document.querySelectorAll('.insight-card').forEach(card => {
    const nameMatch = card.querySelector('.card-name').textContent.toLowerCase().includes(kw);
    const statusMatch = currentFilter === 'all' || card.dataset.status === currentFilter;
    card.style.display = (nameMatch && statusMatch) ? '' : 'none';
  });
}

/* ════════════════════════════
   页面跳转
════════════════════════════ */
function goSetting()      { window.location.href = 'IndustryInsights_setting.html'; }
function goProgress()     { window.location.href = 'IndustryInsights_progress.html'; }
function goDetail()       { window.location.href = 'IndustryInsights_detail.html'; }
function goTemplateList() { window.location.href = 'IndustryInsights_templatelist.html'; }
</script>
</body>
</html>
