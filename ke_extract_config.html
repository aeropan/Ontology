<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽取配置 · 本体智见平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/shared.css">
  <script src="scripts/components.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-0);
      font-family: var(--font-sans);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 64px;
    }
    .step-bar {
      background: var(--bg-1);
      border-bottom: 1px solid var(--border-1);
      padding: 0 32px;
      display: flex; align-items: center;
      height: 48px; flex-shrink: 0;
    }
    .step-bar-inner {
      display: flex; align-items: center;
      width: 100%; max-width: 860px; margin: 0 auto;
    }
    .step { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); flex-shrink: 0; }
    .step.done  { color: var(--green); }
    .step.active{ color: var(--blue); font-weight: 600; }
    .step-dot {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1.5px solid currentColor;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; flex-shrink: 0;
    }
    .step.done  .step-dot { background: rgba(16,185,129,.12); }
    .step.active .step-dot { background: rgba(59,130,246,.12); }
    .step-conn { flex: 1; height: 1px; background: var(--border-1); margin: 0 10px; }
    .step-conn.done { background: var(--green); opacity: .4; }

    .page-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px; padding: 40px 32px;
    }
    .placeholder-icon { color: var(--text-3); opacity: .3; }
    .placeholder-title { font-size: 16px; color: var(--text-3); font-weight: 500; }
    .placeholder-sub { font-size: 12px; color: var(--text-3); }

    .fixed-footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg-1); border-top: 1px solid var(--border-1);
      padding: 12px 32px;
      display: flex; align-items: center; justify-content: space-between;
      z-index: 100;
    }
    .footer-actions { display: flex; gap: 10px; margin-left: auto; }
  </style>
</head>
<body>

<div class="step-bar">
  <div class="step-bar-inner">
    <div class="step done"><div class="step-dot">✓</div><span>新建任务</span></div>
    <div class="step-conn done"></div>
    <div class="step done"><div class="step-dot">✓</div><span>文献上传</span></div>
    <div class="step-conn done"></div>
    <div class="step done"><div class="step-dot">✓</div><span>文献质检</span></div>
    <div class="step-conn done"></div>
    <div class="step active"><div class="step-dot">4</div><span>抽取配置</span></div>
    <div class="step-conn"></div>
    <div class="step"><div class="step-dot">5</div><span>确认结果</span></div>
  </div>
</div>

<div class="page-wrap">
  <div class="placeholder-icon">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
      <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="placeholder-title">抽取配置</div>
  <div class="placeholder-sub">此页面内容待开发</div>
</div>

<div class="fixed-footer">
  <div class="footer-actions">
    <button class="btn btn-ghost" onclick="window.location.href='ke_qa.html'">← 上一步</button>
    <button class="btn btn-primary" onclick="window.location.href='main.html?page=ke-review'">下一步：确认结果 →</button>
  </div>
</div>

<div id="toast-container"></div>
</body>
</html>
