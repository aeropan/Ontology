<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG规则 · 详情</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c18;
  --surface: #0f1729;
  --surface2: #131d30;
  --surface3: #1a2540;
  --border: #1e2d4a;
  --border2: #253550;
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,0.15);
  --purple: #8b5cf6;
  --purple-dim: rgba(139,92,246,0.15);
  --green: #10b981;
  --green-dim: rgba(16,185,129,0.12);
  --amber: #f59e0b;
  --amber-dim: rgba(245,158,11,0.12);
  --rose: #f43f5e;
  --text1: #e2e8f0;
  --text2: #94a3b8;
  --text3: #475569;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--text1);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── 顶部工具栏 ── */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 10px; }
.page-title  { font-size: 15px; font-weight: 600; color: var(--text1); }
.page-subtitle { font-size: 11px; color: var(--text3); }

.topbar-right { display: flex; align-items: center; gap: 10px; }

.btn-ghost {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  background: transparent; border: 1px solid var(--border2);
  border-radius: 8px; font-size: 13px;
  font-family: inherit; color: var(--text2);
  cursor: pointer; transition: all 0.15s;
}
.btn-ghost:hover { border-color: var(--text2); color: var(--text1); }

.btn-primary {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 16px;
  background: var(--blue); border: none;
  border-radius: 8px; font-size: 13px;
  font-family: inherit; color: #fff;
  cursor: pointer; transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.85; }

/* ── 内容区 ── */
.content {
  flex: 1;
  padding: 32px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  max-width: 860px;
}

/* 占位区域 */
.placeholder-section {
  background: var(--surface);
  border: 1px dashed var(--border2);
  border-radius: 12px;
  padding: 40px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 120px;
}
.placeholder-section.tall { min-height: 200px; }
.placeholder-icon { font-size: 28px; opacity: 0.4; }
.placeholder-label {
  font-size: 12px; color: var(--text3);
  letter-spacing: 0.5px;
}
</style>
</head>
<body>

<!-- ── 顶部工具栏 ── -->
<div class="topbar">
  <div class="topbar-left">
    <div>
      <div class="page-title">RAG规则详情</div>
      <div class="page-subtitle">配置检索增强规则参数</div>
    </div>
  </div>
  <div class="topbar-right">
    <button class="btn-ghost" onclick="goBack()">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3L5 8l5 5"/></svg>
      返回
    </button>
    <button class="btn-primary" onclick="handleConfirm()">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l4 4 6-7"/></svg>
      确认添加
    </button>
  </div>
</div>

<!-- ── 内容区（预留，暂不填充） ── -->
<div class="content">
  <div class="placeholder-section">
    <div class="placeholder-icon">📋</div>
    <div class="placeholder-label">基本信息配置区域</div>
  </div>
  <div class="placeholder-section tall">
    <div class="placeholder-icon">🔍</div>
    <div class="placeholder-label">检索策略配置区域</div>
  </div>
  <div class="placeholder-section tall">
    <div class="placeholder-icon">⚙</div>
    <div class="placeholder-label">增强参数配置区域</div>
  </div>
</div>

<script>
function goBack() {
  window.location.href = 'RAGrule_list.html';
}
function handleConfirm() {
  // 待实现
}
</script>
</body>
</html>
