<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG增强管理 · 规则列表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c18;
  --surface: #0f1729;
  --surface2: #131d30;
  --surface3: #1a2540;
  --border: #1e2d4a;
  --border2: #253550;
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,0.15);
  --purple: #8b5cf6;
  --purple-dim: rgba(139,92,246,0.15);
  --green: #10b981;
  --green-dim: rgba(16,185,129,0.12);
  --amber: #f59e0b;
  --amber-dim: rgba(245,158,11,0.12);
  --rose: #f43f5e;
  --rose-dim: rgba(244,63,94,0.12);
  --text1: #e2e8f0;
  --text2: #94a3b8;
  --text3: #475569;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--text1);
  min-height: 100vh;
  padding: 24px;
}

/* ── 页头 ── */
.page-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 24px;
}
.page-title { font-size: 18px; font-weight: 600; color: var(--text1); }
.page-desc  { font-size: 12px; color: var(--text3); margin-top: 3px; }
.btn-primary {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 16px; background: var(--blue);
  color: #fff; border: none; border-radius: 8px;
  font-size: 13px; font-family: inherit; cursor: pointer;
  transition: opacity 0.15s; flex-shrink: 0;
}
.btn-primary:hover { opacity: 0.85; }

/* ── 卡片网格 ── */
.rule-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}

/* ── 卡片 ── */
.rule-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  transition: border-color 0.15s, background 0.15s;
  position: relative;
  cursor: pointer;
}
.rule-card:hover { border-color: var(--border2); background: var(--surface2); }

/* 顶部颜色条（data-color 属性驱动） */
.rule-card[data-color="cyan"]   { border-top: 4px solid #0ea5e9; }
.rule-card[data-color="amber"]  { border-top: 4px solid var(--amber); }
.rule-card[data-color="purple"] { border-top: 4px solid var(--purple); }
.rule-card[data-color="cyan"]:hover   { border-top-color: #0ea5e9; }
.rule-card[data-color="amber"]:hover  { border-top-color: var(--amber); }
.rule-card[data-color="purple"]:hover { border-top-color: var(--purple); }

/* 本体彩色徽章 */
.onto-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 4px;
  font-size: 10px; font-weight: 500;
}
.onto-cyan   { background: rgba(14,165,233,0.14); color: #0ea5e9; }
.onto-amber  { background: var(--amber-dim);       color: var(--amber); }
.onto-purple { background: var(--purple-dim);      color: var(--purple); }
.onto-gray   { background: var(--surface3);        color: var(--text3); }

/* 卡片头部：名称 + 设置按钮 */
.card-head {
  display: flex; align-items: flex-start;
  justify-content: space-between; gap: 8px;
  margin-bottom: 10px;
}
.card-name {
  font-size: 14px; font-weight: 600; color: var(--text1); line-height: 1.4;
}

/* 设置按钮 */
.card-settings-wrap { position: relative; flex-shrink: 0; }
.btn-settings {
  width: 28px; height: 28px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  background: none; border: 1px solid transparent;
  cursor: pointer; color: var(--text3); transition: all 0.15s;
}
.btn-settings:hover, .btn-settings.open {
  background: var(--surface3);
  border-color: var(--border);
  color: var(--text2);
}

/* 下拉操作菜单 */
.settings-dropdown {
  display: none;
  position: absolute; top: calc(100% + 4px); right: 0;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  min-width: 110px;
  z-index: 50;
  overflow: hidden;
}
.settings-dropdown.show { display: block; }
.dropdown-item {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 14px;
  font-size: 12px; color: var(--text2);
  cursor: pointer; transition: all 0.12s;
  border: none; background: none;
  width: 100%; font-family: inherit; text-align: left;
}
.dropdown-item:hover { background: var(--surface3); color: var(--text1); }
.dropdown-item.danger { color: var(--rose); }
.dropdown-item.danger:hover { background: var(--rose-dim); }

/* 描述文字 */
.card-desc {
  font-size: 12px; color: var(--text2); line-height: 1.6;
  margin-bottom: 14px;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}

/* 卡片底部：元信息 */
.card-footer {
  display: flex; align-items: center; gap: 14px;
  padding-top: 12px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text3);
}
.card-meta-item { display: flex; align-items: center; gap: 4px; }

/* ── 删除确认弹窗 ── */
.modal-mask {
  display: none; position: fixed; inset: 0;
  background: rgba(8,12,24,0.75);
  backdrop-filter: blur(4px);
  z-index: 200; align-items: center; justify-content: center;
}
.modal-mask.show { display: flex; }

.confirm-modal {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 14px;
  width: 380px; max-width: 92vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  padding: 28px 28px 22px;
}
.confirm-icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: var(--rose-dim); border: 1px solid rgba(244,63,94,0.25);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; margin-bottom: 16px;
}
.confirm-title {
  font-size: 15px; font-weight: 600; margin-bottom: 8px;
}
.confirm-desc {
  font-size: 12px; color: var(--text2); line-height: 1.7; margin-bottom: 22px;
}
.confirm-desc strong { color: var(--text1); }
.confirm-actions { display: flex; justify-content: flex-end; gap: 10px; }
.btn-cancel {
  padding: 8px 16px; background: var(--surface3);
  border: 1px solid var(--border2); border-radius: 8px;
  font-size: 13px; font-family: inherit; color: var(--text2);
  cursor: pointer; transition: all 0.15s;
}
.btn-cancel:hover { color: var(--text1); }
.btn-danger {
  padding: 8px 16px; background: var(--rose);
  border: none; border-radius: 8px;
  font-size: 13px; font-family: inherit; color: #fff;
  cursor: pointer; transition: opacity 0.15s;
}
.btn-danger:hover { opacity: 0.85; }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--surface3); border: 1px solid var(--border2);
  color: var(--text1); padding: 10px 16px; border-radius: 8px;
  font-size: 12px; opacity: 0; transform: translateY(8px);
  transition: all 0.2s; pointer-events: none; z-index: 9999;
}
.toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<!-- ── 页头 ── -->
<div class="page-header">
  <div>
    <div class="page-title">RAG增强管理</div>
    <div class="page-desc">管理检索增强生成（RAG）规则集，配置知识检索与增强策略</div>
  </div>
  <button class="btn-primary" onclick="goDetail()">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 2v12M2 8h12"/></svg>
    新建RAG规则
  </button>
</div>

<!-- ── 卡片列表 ── -->
<div class="rule-grid" id="rule-grid">

  <div class="rule-card" data-id="1" data-name="风电预测增强规则集" data-color="cyan" onclick="goDetail()">
    <div class="card-head">
      <div class="card-name">风电预测增强规则集</div>
      <div class="card-settings-wrap" onclick="event.stopPropagation()">
        <button class="btn-settings" onclick="toggleDropdown(this)">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="3" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="13" r="1.2" fill="currentColor" stroke="none"/></svg>
        </button>
        <div class="settings-dropdown">
          <button class="dropdown-item" onclick="handleEdit(this)">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 2l3 3-8 8H3v-3l8-8z"/></svg>
            修改
          </button>
          <button class="dropdown-item" onclick="handleCopy(this)">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8" height="8" rx="1"/><path d="M3 11V3h8"/></svg>
            复制
          </button>
          <button class="dropdown-item danger" onclick="handleDelete(this)">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h10M6 5V3h4v2M6 8v4M10 8v4"/><rect x="4" y="5" width="8" height="9" rx="1"/></svg>
            删除
          </button>
        </div>
      </div>
    </div>
    <div class="card-desc">基于ERA5气象数据与风机运行数据，配置混合检索策略，增强风速预测模型的上下文理解能力。</div>
    <div class="card-footer">
      <span class="card-meta-item">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12v10H2z"/><path d="M5 2v4M11 2v4M2 8h12"/></svg>
        2026-03-15
      </span>
      <span class="card-meta-item">
        <span class="onto-badge onto-cyan">
          <svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/></svg>
          风电本体 v2
        </span>
      </span>
    </div>
  </div>

  <div class="rule-card" data-id="2" data-name="气象灾害检索规则" data-color="amber" onclick="goDetail()">
    <div class="card-head">
      <div class="card-name">气象灾害检索规则</div>
      <div class="card-settings-wrap" onclick="event.stopPropagation()">
        <button class="btn-settings" onclick="toggleDropdown(this)">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="3" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="13" r="1.2" fill="currentColor" stroke="none"/></svg>
        </button>
        <div class="settings-dropdown">
          <button class="dropdown-item" onclick="handleEdit(this)">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 2l3 3-8 8H3v-3l8-8z"/></svg>
            修改
          </button>
          <button class="dropdown-item" onclick="handleCopy(this)">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8" height="8" rx="1"/><path d="M3 11V3h8"/></svg>
            复制
          </button>
          <button class="dropdown-item danger" onclick="handleDelete(this)">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h10M6 5V3h4v2M6 8v4M10 8v4"/><rect x="4" y="5" width="8" height="9" rx="1"/></svg>
            删除
          </button>
        </div>
      </div>
    </div>
    <div class="card-desc">针对气象灾害预警场景，定义向量相似度阈值与关键词权重，优先检索高置信度气象事件文献。</div>
    <div class="card-footer">
      <span class="card-meta-item">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12v10H2z"/><path d="M5 2v4M11 2v4M2 8h12"/></svg>
        2026-03-28
      </span>
      <span class="card-meta-item">
        <span class="onto-badge onto-amber">
          <svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/></svg>
          灾害预警图谱 v1
        </span>
      </span>
    </div>
  </div>

  <div class="rule-card" data-id="3" data-name="通用文献语义检索" data-color="purple" onclick="goDetail()">
    <div class="card-head">
      <div class="card-name">通用文献语义检索</div>
      <div class="card-settings-wrap" onclick="event.stopPropagation()">
        <button class="btn-settings" onclick="toggleDropdown(this)">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="3" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="8" r="1.2" fill="currentColor" stroke="none"/><circle cx="8" cy="13" r="1.2" fill="currentColor" stroke="none"/></svg>
        </button>
        <div class="settings-dropdown">
          <button class="dropdown-item" onclick="handleEdit(this)">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M11 2l3 3-8 8H3v-3l8-8z"/></svg>
            修改
          </button>
          <button class="dropdown-item" onclick="handleCopy(this)">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8" height="8" rx="1"/><path d="M3 11V3h8"/></svg>
            复制
          </button>
          <button class="dropdown-item danger" onclick="handleDelete(this)">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 5h10M6 5V3h4v2M6 8v4M10 8v4"/><rect x="4" y="5" width="8" height="9" rx="1"/></svg>
            删除
          </button>
        </div>
      </div>
    </div>
    <div class="card-desc">不依赖特定本体的通用语义检索规则，适用于探索性查询场景，支持跨领域文献的模糊匹配与聚合。</div>
    <div class="card-footer">
      <span class="card-meta-item">
        <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12v10H2z"/><path d="M5 2v4M11 2v4M2 8h12"/></svg>
        2026-04-02
      </span>
      <span class="card-meta-item">
        <span class="onto-badge onto-gray">
          <svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="6"/></svg>
          无关联本体
        </span>
      </span>
    </div>
  </div>

</div>

<!-- ── 删除确认弹窗 ── -->
<div class="modal-mask" id="delete-modal" onclick="handleModalMaskClick(event)">
  <div class="confirm-modal" onclick="event.stopPropagation()">
    <div class="confirm-icon">🗑</div>
    <div class="confirm-title">确认删除规则</div>
    <div class="confirm-desc">即将删除规则集 <strong id="delete-target-name"></strong>，此操作不可撤销，相关配置将永久移除。</div>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeDeleteModal()">取消</button>
      <button class="btn-danger" onclick="confirmDelete()">确认删除</button>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div class="toast" id="toast"></div>

<script>
let pendingDeleteCard = null;

/* ── 设置下拉菜单 ── */
function toggleDropdown(btn) {
  const dropdown = btn.nextElementSibling;
  const isOpen = dropdown.classList.contains('show');

  // 关闭所有下拉
  closeAllDropdowns();

  if (!isOpen) {
    dropdown.classList.add('show');
    btn.classList.add('open');
  }
}

function closeAllDropdowns() {
  document.querySelectorAll('.settings-dropdown.show').forEach(d => d.classList.remove('show'));
  document.querySelectorAll('.btn-settings.open').forEach(b => b.classList.remove('open'));
}

// 点击页面其他区域关闭下拉
document.addEventListener('click', function(e) {
  if (!e.target.closest('.card-settings-wrap')) {
    closeAllDropdowns();
  }
});

/* ── 操作处理 ── */
function handleEdit(btn) {
  closeAllDropdowns();
  goDetail();
}

function handleCopy(btn) {
  closeAllDropdowns();
  const card = btn.closest('.rule-card');
  const name = card.dataset.name;
  showToast('已复制规则集：' + name);
}

function handleDelete(btn) {
  closeAllDropdowns();
  const card = btn.closest('.rule-card');
  pendingDeleteCard = card;
  document.getElementById('delete-target-name').textContent = card.dataset.name;
  document.getElementById('delete-modal').classList.add('show');
}

function closeDeleteModal() {
  document.getElementById('delete-modal').classList.remove('show');
  pendingDeleteCard = null;
}

function handleModalMaskClick(e) {
  if (e.target === document.getElementById('delete-modal')) closeDeleteModal();
}

function confirmDelete() {
  if (pendingDeleteCard) {
    const name = pendingDeleteCard.dataset.name;
    pendingDeleteCard.remove();
    pendingDeleteCard = null;
    closeDeleteModal();
    showToast('已删除规则集：' + name);
  }
}

/* ── 跳转 ── */
function goDetail() {
  window.location.href = 'RAGrule_detail.html';
}

/* ── Toast ── */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
