<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业务本体模板库 - 本体智见</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/shared.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg-0);
      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 32px;
      border-bottom: 1px solid var(--border-1);
      background: var(--bg-1);
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-1);
    }

    .page-title span {
      color: var(--blue);
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--text-3);
      margin-top: 4px;
    }

    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .page-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-3);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="page-header">
    <div>
      <div class="page-title">业务本体<span>模板库</span></div>
      <div class="page-subtitle">ArrangeTemplate — 选择模板快速创建业务本体</div>
    </div>
    <div class="nav-actions">
      <button class="btn btn-ghost" onclick="history.back()">← 返回</button>
      <button class="btn btn-primary" onclick="location.href='Arrange.html'">前往编排 →</button>
    </div>
  </div>

  <div class="page-body">
    （模板内容建设中）
  </div>

</body>
</html>
