<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业务本体模板库 - 本体智见</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/shared.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ---- 顶部导航 ---- */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border-1);
      background: var(--bg-1);
      flex-shrink: 0;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-1);
    }

    .page-title span { color: var(--blue); }

    .page-subtitle {
      font-size: 13px;
      color: var(--text-3);
      margin-top: 3px;
    }

    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* ---- 卡片区域 ---- */
    .template-body {
      flex: 1;
      padding: 32px;
      overflow-y: auto;
    }

    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
      max-width: 1400px;
    }

    /* ---- 模板卡片 ---- */
    .template-card {
      position: relative;
      background: var(--bg-2);
      border: 2px solid var(--border-1);
      border-radius: var(--radius-lg);
      padding: 24px;
      cursor: pointer;
      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
      user-select: none;
    }

    .template-card:hover {
      background: var(--bg-3);
      border-color: var(--border-2);
    }

    .template-card.selected {
      border-color: var(--blue);
      background: var(--bg-3);
      box-shadow: 0 0 0 3px var(--blue-dim), var(--shadow-md);
    }

    /* 选中角标 */
    .card-check {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--blue);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #fff;
      line-height: 1;
    }

    .template-card.selected .card-check {
      display: flex;
    }

    /* ---- 卡片内容 ---- */
    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 20px;
      padding-right: 36px; /* 避开角标 */
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--blue-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .card-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-1);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .industry-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      background: var(--green-dim);
      color: var(--green);
    }

    /* ---- 字段行 ---- */
    .card-field {
      margin-bottom: 14px;
    }

    .field-label {
      font-size: 11px;
      color: var(--text-3);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .onto-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .onto-tag {
      padding: 3px 10px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      background: var(--blue-dim);
      color: var(--blue);
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .field-text {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.65;
    }

    /* ---- 卡片底部 ---- */
    .card-footer {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border-1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-date {
      font-size: 12px;
      color: var(--text-3);
    }

    .footer-date strong {
      color: var(--text-2);
      font-weight: 400;
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <div class="page-header">
    <div>
      <div class="page-title">业务本体<span>模板库</span></div>
      <div class="page-subtitle">选择模板，快速创建业务本体任务</div>
    </div>
    <div class="nav-actions">
      <button class="btn btn-ghost" onclick="history.back()">返回</button>
      <button class="btn btn-primary" id="btn-use" disabled onclick="location.href='Arrange.html'">使用模板新建</button>
    </div>
  </div>

  <!-- 卡片区域 -->
  <div class="template-body">
    <div class="template-grid" id="card-grid">

      <!-- 卡片：山地风力发电预测 -->
      <div class="template-card" onclick="selectCard(this)">
        <div class="card-check">✓</div>
        <div class="card-header">
          <div class="card-icon">🌬️</div>
          <div>
            <div class="card-name">山地风力发电预测</div>
            <span class="industry-badge">新能源</span>
          </div>
        </div>

        <div class="card-field">
          <div class="field-label">使用本体</div>
          <div class="onto-tags">
            <span class="onto-tag">风力预测本体</span>
            <span class="onto-tag">发电预测本体</span>
          </div>
        </div>

        <div class="card-field">
          <div class="field-label">描述说明</div>
          <div class="field-text">使用星阙大模型针对山地地区的风力发电预测</div>
        </div>

        <div class="card-footer">
          <span class="footer-date">创建日期：<strong>2026-03-15</strong></span>
        </div>
      </div>

    </div>
  </div>

  <script>
    function selectCard(card) {
      const allCards = document.querySelectorAll('.template-card');
      allCards.forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      document.getElementById('btn-use').disabled = false;
    }
  </script>

</body>
</html>
