<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抽取结果审核 · 本体智见平台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/shared.css">
  <script src="scripts/components.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-0);
      font-family: var(--font-sans);
      color: var(--text-1);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── 步骤条 ── */
    .step-bar {
      background: var(--bg-1);
      border-bottom: 1px solid var(--border-1);
      padding: 0 32px;
      display: flex; align-items: center;
      height: 48px; flex-shrink: 0;
    }
    .step-bar-inner {
      display: flex; align-items: center;
      width: 100%; max-width: 860px; margin: 0 auto;
    }
    .step { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-3); flex-shrink: 0; }
    .step.done  { color: var(--green); }
    .step.active{ color: var(--blue); font-weight: 600; }
    .step-dot {
      width: 22px; height: 22px; border-radius: 50%;
      border: 1.5px solid currentColor;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; flex-shrink: 0;
    }
    .step.done  .step-dot { background: rgba(16,185,129,.12); }
    .step.active .step-dot { background: rgba(59,130,246,.12); }
    .step-conn { flex: 1; height: 1px; background: var(--border-1); margin: 0 10px; }
    .step-conn.done { background: var(--green); opacity: .4; }

    /* ── 主内容（可滚动） ── */
    .page-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 24px 32px 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── 页面标题 ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .page-title { font-size: 20px; font-weight: 700; }
    .page-title span { color: var(--blue); }
    .page-sub { font-size: 12px; color: var(--text-3); margin-top: 3px; }
    .header-actions { display: flex; gap: 8px; }

    /* ── 摘要卡片 ── */
    .summary-card {
      background: var(--bg-2);
      border: 1px solid var(--border-1);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
    }
    .summary-title { font-size: 13px; font-weight: 600; margin-bottom: 16px; }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }
    .summary-item {
      text-align: center;
      padding: 4px 0;
      border-right: 1px solid var(--border-1);
    }
    .summary-item:last-child { border-right: none; }
    .summary-num {
      font-size: 28px; font-weight: 700;
      font-family: var(--font-mono);
      line-height: 1.2;
    }
    .summary-label { font-size: 11px; color: var(--text-2); margin-top: 5px; }

    /* ── 折叠区块 ── */
    .review-section { display: flex; flex-direction: column; gap: 0; }
    .review-toggle {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-3);
      padding: 12px 16px;
      border: 1px solid var(--border-1);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: background .15s;
      user-select: none;
    }
    .review-toggle:hover { background: var(--bg-4); }
    .review-toggle.expanded { border-radius: var(--radius-md) var(--radius-md) 0 0; border-bottom-color: transparent; }
    .review-toggle-left { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
    .review-toggle-right { font-size: 12px; color: var(--text-3); }

    .review-body {
      display: none;
      background: var(--bg-2);
      border: 1px solid var(--border-1);
      border-top: none;
      border-radius: 0 0 var(--radius-md) var(--radius-md);
      overflow: hidden;
    }
    .review-body.open { display: block; }

    /* ── 表格 ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      background: var(--bg-3);
      padding: 8px 14px;
      font-size: 11px; font-weight: 500;
      color: var(--text-2); text-align: left;
      border-bottom: 1px solid var(--border-1);
      white-space: nowrap;
    }
    td {
      padding: 10px 14px; font-size: 12px;
      border-bottom: 1px solid var(--border-1);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,.015); }
    tr.row-rejected { background: rgba(244,63,94,.04); }
    tr.row-uncertain { background: rgba(245,158,11,.04); }

    /* 复选框 */
    .row-cb { accent-color: var(--blue); width: 14px; height: 14px; cursor: pointer; }

    /* 概念名称（等宽字体）*/
    .concept-name {
      font-family: var(--font-mono); font-size: 11px; font-weight: 600;
    }

    /* 置信度条 */
    .conf-cell { display: flex; align-items: center; gap: 8px; }
    .conf-track { width: 60px; height: 4px; background: var(--bg-0); border-radius: 2px; flex-shrink: 0; }
    .conf-fill  { height: 100%; border-radius: 2px; }
    .conf-label { font-size: 11px; font-family: var(--font-mono); min-width: 32px; }

    /* 关系谓词方向 */
    .rel-direction { display: flex; align-items: center; gap: 5px; font-size: 11px; }
    .rel-badge {
      padding: 2px 7px; border-radius: 3px;
      font-family: var(--font-mono); font-size: 10px;
    }
    .rel-badge-blue   { background: rgba(6,182,212,.12);  color: #06b6d4; }
    .rel-badge-amber  { background: var(--amber-dim);     color: var(--amber); }
    .rel-badge-rose   { background: var(--rose-dim);      color: var(--rose); }

    /* 操作链接 */
    .action-link {
      color: var(--blue); font-size: 11px; cursor: pointer;
      transition: opacity .15s;
    }
    .action-link:hover { opacity: .7; }
  </style>
</head>
<body>

<!-- 步骤条 -->
<div class="step-bar">
  <div class="step-bar-inner">
    <div class="step done"><div class="step-dot">✓</div><span>新建任务</span></div>
    <div class="step-conn done"></div>
    <div class="step done"><div class="step-dot">✓</div><span>文献上传</span></div>
    <div class="step-conn done"></div>
    <div class="step done"><div class="step-dot">✓</div><span>文献质检</span></div>
    <div class="step-conn done"></div>
    <div class="step done"><div class="step-dot">✓</div><span>抽取配置</span></div>
    <div class="step-conn done"></div>
    <div class="step active"><div class="step-dot">5</div><span>确认结果</span></div>
  </div>
</div>

<!-- 主内容 -->
<div class="page-wrap">

  <!-- 标题行 -->
  <div class="page-header">
    <div>
      <div class="page-title">抽取结果<span>审核</span></div>
      <div class="page-sub">全面掌握抽取成效，展开明细进行人工审核校验</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-ghost" onclick="window.location.href='ke_extract_config.html'">← 返回</button>
      <button class="btn btn-primary" onclick="window.location.href='graph.html'">完成审核，生成本体图 →</button>
    </div>
  </div>

  <!-- 摘要卡片 -->
  <div class="summary-card">
    <div class="summary-title">本次抽取结果摘要</div>
    <div class="summary-grid">
      <div class="summary-item">
        <div class="summary-num" style="color:var(--text-1)">87</div>
        <div class="summary-label">抽取概念</div>
      </div>
      <div class="summary-item">
        <div class="summary-num" style="color:var(--blue)">79</div>
        <div class="summary-label">保留概念</div>
      </div>
      <div class="summary-item">
        <div class="summary-num" style="color:var(--text-1)">54</div>
        <div class="summary-label">抽取关系</div>
      </div>
      <div class="summary-item">
        <div class="summary-num" style="color:#06b6d4">43</div>
        <div class="summary-label">确认关系</div>
      </div>
      <div class="summary-item">
        <div class="summary-num" style="color:var(--green)">22</div>
        <div class="summary-label">来源文献</div>
      </div>
    </div>
  </div>

  <!-- 概念审核 -->
  <div class="review-section">
    <div class="review-toggle" id="concept-toggle" onclick="toggleSection('concept')">
      <div class="review-toggle-left">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
          <rect x="1" y="1" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.3"/>
          <path d="M4 8h8M4 5h5M4 11h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
        概念审核
      </div>
      <div class="review-toggle-right" id="concept-toggle-label">展开/折叠 ▼</div>
    </div>
    <div class="review-body" id="concept-body">
      <table>
        <thead>
          <tr>
            <th style="width:36px"><input type="checkbox" class="row-cb" checked onchange="toggleAllConcepts(this.checked)"></th>
            <th>概念名称</th>
            <th style="width:100px">类型</th>
            <th style="width:130px">置信度</th>
            <th>定义预览（专业）</th>
            <th style="width:120px">概念说明（通俗）</th>
            <th style="width:50px">操作</th>
          </tr>
        </thead>
        <tbody id="concept-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- 关系审核 -->
  <div class="review-section">
    <div class="review-toggle" id="relation-toggle" onclick="toggleSection('relation')">
      <div class="review-toggle-left">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
          <circle cx="3" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
          <circle cx="13" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
          <path d="M5 8h6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <path d="M9 6l2 2-2 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        关系审核
      </div>
      <div class="review-toggle-right" id="relation-toggle-label">展开/折叠 ▼</div>
    </div>
    <div class="review-body" id="relation-body">
      <table>
        <thead>
          <tr>
            <th style="width:36px"><input type="checkbox" class="row-cb" checked onchange="toggleAllRelations(this.checked)"></th>
            <th>主体（Subject）</th>
            <th style="width:180px">关系谓词</th>
            <th>客体（Object）</th>
            <th style="width:80px">关系说明（专业）</th>
            <th>关系说明（通俗）</th>
            <th style="width:130px">置信度</th>
            <th style="width:50px">操作</th>
          </tr>
        </thead>
        <tbody id="relation-tbody"></tbody>
      </table>
    </div>
  </div>

</div><!-- /page-wrap -->

<div id="toast-container"></div>

<script>
  /* ══════════════════════════════════════
     概念数据
  ══════════════════════════════════════ */
  const CONCEPTS = [
    { name: 'WindSpeedForecast', color: 'var(--blue)',   type: 'Class',    typeBadge: 'badge-blue',   conf: 95, def: '对未来一段时间内风速变化的数字化预报结果，是风电功率预测的核心输入。',    simple: '风速预测',   checked: true  },
    { name: 'ForecastModel',    color: 'var(--blue)',   type: 'Class',    typeBadge: 'badge-blue',   conf: 88, def: '基于历史气象和测风数据构建的算法模型，用于实现风速或风功率的未来预测。',  simple: 'AI预测系统', checked: true  },
    { name: 'hasInputData',     color: 'var(--purple)', type: 'Property', typeBadge: 'badge-purple', conf: 76, def: '模型接收的输入数据属性，描述预测模型与输入特征之间的依赖关系。',              simple: '接收输入',   checked: true  },
    { name: 'ImagePreprocessing', color: 'var(--rose)', type: 'Class',    typeBadge: 'badge-blue',   conf: 45, def: '图像预处理步骤，包含归一化、降噪、尺寸调整等数据标准化操作。',               simple: '前处理步骤', checked: false },
    { name: 'MeteoEnv',         color: 'var(--green)',  type: 'Instance', typeBadge: 'badge-green',  conf: 91, def: '影响风力发电的气象要素总称，包括风速、风向、温度、气压、湿度等。',            simple: '输入特征',   checked: true  },
    { name: 'WindStation',      color: 'var(--blue)',   type: 'Class',    typeBadge: 'badge-blue',   conf: 91, def: '风电场测风塔或测风站实时采集的实际风速、风向等观测数据。',                    simple: '测风站数据', checked: true  },
    { name: 'TopoSpace',        color: 'var(--blue)',   type: 'Class',    typeBadge: 'badge-blue',   conf: 88, def: '描述风电场复杂地形对风流场影响的数字化空间特征，用于精细化风速订正。',        simple: '地形空间',   checked: true  },
    { name: 'OutputReport',     color: 'var(--green)',  type: 'Instance', typeBadge: 'badge-green',  conf: 89, def: '根据风速预测结果，计算未来风电机组或风电场发电功率的数字化预报。',            simple: '风功率预测', checked: true  },
    { name: 'ERA5Dataset',      color: 'var(--blue)',   type: 'Class',    typeBadge: 'badge-blue',   conf: 83, def: 'ECMWF 提供的全球气候再分析数据集，包含历史气象要素的高分辨率格点数据。',      simple: 'ERA5数据',   checked: true  },
    { name: 'LSTMModel',        color: 'var(--purple)', type: 'Property', typeBadge: 'badge-purple', conf: 79, def: '长短期记忆网络，擅长捕捉时间序列中的长程依赖关系，广泛用于风速预测。',        simple: 'LSTM模型',   checked: true  },
    { name: 'EnsembleMethod',   color: 'var(--blue)',   type: 'Class',    typeBadge: 'badge-blue',   conf: 67, def: '通过融合多个单一模型的预测结果降低误差方差，提升整体预测稳定性的方法论。',    simple: '集成方法',   checked: true  },
    { name: 'ConfidenceScore',  color: 'var(--amber)',  type: 'Class',    typeBadge: 'badge-amber',  conf: 52, def: '衡量模型输出结果可信程度的量化指标，通常以概率或百分比形式呈现。',            simple: '置信评分',   checked: false },
  ];

  /* ══════════════════════════════════════
     关系数据
  ══════════════════════════════════════ */
  const RELATIONS = [
    { subj: 'MeteoEnv',         subjColor: 'var(--blue)',   pred: 'isSubClassOf', predStyle: 'blue',  certain: true,  obj: 'WindSpeedForecast', objColor: 'var(--blue)',   defLabel: 'is',      simple: '气象环境 是一种 风速预测',           conf: 96, checked: true  },
    { subj: 'ForecastModel',    subjColor: 'var(--blue)',   pred: 'hasInputData', predStyle: 'blue',  certain: true,  obj: 'WindSpeedForecast', objColor: 'var(--blue)',   defLabel: 'needs',   simple: '预测模型 需要 风速预测 作为输入数据', conf: 83, checked: true  },
    { subj: 'ImagePreprocessing', subjColor: 'var(--amber)', pred: 'precedes',   predStyle: 'amber', certain: false, obj: 'ForecastModel',     objColor: 'var(--amber)',  defLabel: 'as',      simple: '数据预处理 在 预测模型 运行之前 完成', conf: 58, checked: false },
    { subj: 'WindStation',      subjColor: 'var(--blue)',   pred: 'isSubClassOf', predStyle: 'blue',  certain: true,  obj: 'WindSpeedForecast', objColor: 'var(--blue)',   defLabel: 'is',      simple: '测风站数据 是一种 风速预测',           conf: 92, checked: true  },
    { subj: 'OutputReport',     subjColor: 'var(--rose)',   pred: 'generatedBy',  predStyle: 'rose',  certain: false, obj: 'ForecastModel',     objColor: 'var(--rose)',   defLabel: 'because', simple: '风功率预测 由 预测模型 生成',          conf: 41, checked: false },
    { subj: 'ERA5Dataset',      subjColor: 'var(--blue)',   pred: 'providesData', predStyle: 'blue',  certain: true,  obj: 'MeteoEnv',          objColor: 'var(--blue)',   defLabel: 'supplies', simple: 'ERA5数据集 向 气象环境 提供输入',     conf: 88, checked: true  },
    { subj: 'LSTMModel',        subjColor: 'var(--blue)',   pred: 'implements',   predStyle: 'blue',  certain: true,  obj: 'ForecastModel',     objColor: 'var(--blue)',   defLabel: 'realizes', simple: 'LSTM模型 实现了 预测模型 的核心能力', conf: 85, checked: true  },
    { subj: 'EnsembleMethod',   subjColor: 'var(--amber)',  pred: 'combines',     predStyle: 'amber', certain: false, obj: 'LSTMModel',         objColor: 'var(--amber)',  defLabel: 'merges',   simple: '集成方法 融合 多个LSTM模型 的输出',  conf: 63, checked: false },
  ];

  /* ── 置信度颜色 ── */
  function confColor(v) {
    return v >= 80 ? 'var(--green)' : v >= 60 ? 'var(--blue)' : v >= 45 ? 'var(--amber)' : 'var(--rose)';
  }

  /* ── 渲染概念表 ── */
  function renderConcepts() {
    document.getElementById('concept-tbody').innerHTML = CONCEPTS.map((c, i) => {
      const cc = confColor(c.conf);
      const rowCls = !c.checked && c.conf < 50 ? ' class="row-rejected"'
                   : !c.checked ? ' class="row-uncertain"' : '';
      return `<tr${rowCls}>
        <td style="text-align:center">
          <input type="checkbox" class="row-cb" id="cc-${i}" ${c.checked?'checked':''}
            onchange="CONCEPTS[${i}].checked=this.checked">
        </td>
        <td>
          <span class="concept-name" style="color:${c.color}">${c.name}</span>
        </td>
        <td><span class="badge ${c.typeBadge}">${c.type}</span></td>
        <td>
          <div class="conf-cell">
            <div class="conf-track"><div class="conf-fill" style="width:${c.conf}%;background:${cc}"></div></div>
            <span class="conf-label" style="color:${cc}">${c.conf}%</span>
          </div>
        </td>
        <td style="color:var(--text-2);max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"
            title="${c.def}">${c.def}</td>
        <td style="color:var(--text-2)">${c.simple}</td>
        <td><span class="action-link">编辑</span></td>
      </tr>`;
    }).join('');
  }

  /* ── 渲染关系表 ── */
  function renderRelations() {
    document.getElementById('relation-tbody').innerHTML = RELATIONS.map((r, i) => {
      const cc = confColor(r.conf);
      const rowCls = !r.checked && r.conf < 45 ? ' class="row-rejected"'
                   : !r.checked ? ' class="row-uncertain"' : '';
      const badgeCls = `rel-badge rel-badge-${r.predStyle}`;
      const arrow = r.certain ? '→' : '→?';
      return `<tr${rowCls}>
        <td style="text-align:center">
          <input type="checkbox" class="row-cb" id="rc-${i}" ${r.checked?'checked':''}
            onchange="RELATIONS[${i}].checked=this.checked">
        </td>
        <td><span class="concept-name" style="color:${r.subjColor}">${r.subj}</span></td>
        <td>
          <div class="rel-direction" style="color:${r.predStyle==='blue'?'var(--text-2)':r.predStyle==='amber'?'var(--amber)':'var(--rose)'}">
            <span style="font-size:11px">${arrow}</span>
            <span class="${badgeCls}">${r.pred}</span>
          </div>
        </td>
        <td><span class="concept-name" style="color:${r.objColor}">${r.obj}</span></td>
        <td style="color:var(--text-2)">${r.defLabel}</td>
        <td style="color:var(--text-2)">${r.simple}</td>
        <td>
          <div class="conf-cell">
            <div class="conf-track"><div class="conf-fill" style="width:${r.conf}%;background:${cc}"></div></div>
            <span class="conf-label" style="color:${cc}">${r.conf}%</span>
          </div>
        </td>
        <td><span class="action-link">编辑</span></td>
      </tr>`;
    }).join('');
  }

  /* ── 全选/取消 ── */
  function toggleAllConcepts(checked) {
    CONCEPTS.forEach((c, i) => {
      c.checked = checked;
      const cb = document.getElementById('cc-'+i);
      if (cb) cb.checked = checked;
    });
  }
  function toggleAllRelations(checked) {
    RELATIONS.forEach((r, i) => {
      r.checked = checked;
      const cb = document.getElementById('rc-'+i);
      if (cb) cb.checked = checked;
    });
  }

  /* ── 折叠切换 ── */
  function toggleSection(key) {
    const body   = document.getElementById(key+'-body');
    const toggle = document.getElementById(key+'-toggle');
    const isOpen = body.classList.toggle('open');
    toggle.classList.toggle('expanded', isOpen);
  }

  /* ── 初始化 ── */
  renderConcepts();
  renderRelations();
</script>
</body>
</html>
