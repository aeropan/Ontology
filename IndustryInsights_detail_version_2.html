<style>
html, body {
  height: 100%;
  margin: 0;
}
body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--bg-0);
}

/* ── 页头 ── */
.page-header {
  padding: 16px 24px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-shrink: 0;
}
.header-left { display: flex; align-items: center; gap: 14px; }
.header-title { font-size: 17px; font-weight: 700; color: var(--text-1); }
.header-meta {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--text-3);
}
.meta-sep { color: var(--border-2); }
.badge-done {
  padding: 3px 10px; border-radius: 5px;

  background: var(--green-dim); color: var(--green);
}
.header-actions { display: flex; gap: 8px; align-items: center; }

/* ── Sheet 标签栏 ── */
.sheet-tabs {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 24px;
  border-bottom: 1px solid var(--border-1);
  flex-shrink: 0;
  overflow-x: auto;
}
.sheet-tabs::-webkit-scrollbar { height: 0; }
.tab-btn {
  padding: 9px 16px;
  background: transparent;
  border: none; border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-size: 12px; font-family: inherit;
  color: var(--text-3);
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.tab-btn:hover { color: var(--text-1); }
.tab-btn.active {
  color: var(--blue);
  border-bottom-color: var(--blue);
  font-weight: 500;
}
.tab-count {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 18px; height: 16px; padding: 0 5px;
  background: var(--bg-4); border-radius: 8px;
  font-size: 10px; font-family: 'JetBrains Mono', monospace;
  color: var(--text-3); margin-left: 5px;
}
.tab-btn.active .tab-count { background: var(--blue-dim); color: var(--blue); }

/* ── 工具栏 ── */
.grid-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 24px;
  flex-shrink: 0;
}
.toolbar-left { display: flex; align-items: center; gap: 8px; }
.toolbar-right { display: flex; align-items: center; gap: 8px; }

.search-wrap {
  position: relative;
  display: flex; align-items: center;
}
.search-icon {
  position: absolute; left: 9px;

}
.search-input {

  border-radius: 7px;

  font-size: 12px; font-family: inherit;

}
.search-input::placeholder { color: var(--text-3); }
.search-input:focus {

  border-color: var(--blue);
  box-shadow: 0 0 0 2px var(--blue-dim);
}

.row-count-tag {
  font-size: 11px; color: var(--text-3);
  font-family: 'JetBrains Mono', monospace;

  border-radius: 5px; padding: 4px 9px;

.row-count-tag span { color: var(--text-1); font-weight: 600; }

/* ── Grid 容器 ── */

}
#myGrid {

/* ── 加载态 ── */

}

<script>
function gotoExternal(file) {
  if (window.parent !== window) {
    window.parent.postMessage({ type: 'NAVIGATE_TO', file }, '*');
  } else {
    location.href = file;
  }
}

// ── 全局状态 ──
let gridApi = null;
let currentSheet = 0;
const SHEET_NAMES = Object.keys(INDUSTRY_INSIGHTS_DATA);

// ── Sheet 名称与简称映射 ──
const SHEET_LABELS = {
  'ERA5和其他数据源组合调研':       'ERA5数据调研',
  '使用ERA5数据源对应文献及条目':   '使用ERA5文献',
  '未使用ERA5数据源对应文献及条目': '未使用ERA5文献',
  '文献列表':                        '文献列表',
  '截至目前有开源代码的文献':        '开源代码文献',
  '使用物理模型的文献':              '物理模型文献',
};

// ── 需要链接渲染的列名关键词 ──
const LINK_COL_KEYWORDS = ['链接', 'url', 'link', 'doi', 'DOI', '代码'];

// ── 优先级渲染 ──
function priorityCellRenderer(params) {
  const v = params.value;
  if (!v) return '';
  const s = String(v);
  let cls = 'priority-mid';
  if (s.includes('必选') || s.includes('核心') || s.includes('高'))   cls = 'priority-high';
  else if (s.includes('推荐') || s.includes('中'))                    cls = 'priority-mid';
  else if (s.includes('可选') || s.includes('低'))                    cls = 'priority-low';
  else if (s.includes('不推荐') || s.includes('跳过'))                cls = 'priority-skip';
  return `<span class="priority-badge ${cls}">${s}</span>`;
}

// ── 链接渲染 ──
function linkCellRenderer(params) {
  const v = params.value;
  if (!v) return '';
  const s = String(v).trim();
  if (s.startsWith('http') || s.startsWith('https')) {
    const short = s.length > 40 ? s.slice(0, 40) + '…' : s;
    return `<a class="cell-link" href="${s}" target="_blank" title="${s}">${short}</a>`;
  }
  return `<span title="${s}">${s}</span>`;
}

// ── 开源状态渲染 ──
function openStatusRenderer(params) {
  const v = params.value;
  if (!v) return '';
  const s = String(v);
  const isOpen = s.includes('✅') || s.includes('开源') || s.includes('是');
  return `<span class="open-badge ${isOpen ? 'open-yes' : 'open-no'}">${s}</span>`;
}

// ── 判断列是否为链接列 ──
function isLinkCol(colName) {
  const name = String(colName).toLowerCase();
  return LINK_COL_KEYWORDS.some(k => name.includes(k.toLowerCase()));
}

// ── 生成列定义 ──
function buildColDefs(sheetName, headers) {
  return headers
    .filter(h => h != null && h !== '')
    .map((h, idx) => {
      const name = String(h);
      const base = {
        field: name,
        headerName: name,
        sortable: true,
        resizable: true,
        filter: true,
        tooltipValueGetter: p => (p.value != null ? String(p.value) : ''),
        minWidth: 80,
      };

      // Sheet1 前三列固定
      if (sheetName === 'ERA5和其他数据源组合调研' && idx < 3) {
        base.pinned = 'left';
        base.lockPinned = true;
      }

      // 文献列表前两列固定
      if (sheetName === '文献列表' && idx < 2) {
        base.pinned = 'left';
        base.lockPinned = true;
      }

      // 宽度策略
      if (name === 'ID' || name === '论文ID' || name === '序号' || name === '编号') {
        base.width = 80; base.flex = 0;
      } else if (name === '数据类型分类' || name === '算法分类') {
        base.width = 120; base.flex = 0;
      } else if (name === '数据名称' || name === '论文题目' || name === 'title' || name === 'tittle') {
        base.minWidth = 220; base.flex = 2;
        base.wrapText = true; base.autoHeight = true;
        base.cellStyle = { 'line-height': '1.6', 'padding-top': '8px', 'padding-bottom': '8px' };
      } else if (['优先级'].includes(name)) {
        base.width = 100; base.flex = 0;
        base.cellRenderer = priorityCellRenderer;
      } else if (name === '是否(开源/下载/有无数据)' || name === '代码是否开源' || name === '是否使用era5数据作为数据源之一') {
        base.width = 130; base.flex = 0;
        base.cellRenderer = openStatusRenderer;
      } else if (isLinkCol(name)) {
        base.minWidth = 140; base.flex = 1;
        base.cellRenderer = linkCellRenderer;
      } else if (['数据摘要', '判定依据', '核心字段', '特征维度', '数据集规模', '缺失值规则',
                  '元数据表征', '用途', '对应论文与数据量需求', '数据使用', '原文证据',
                  '气象与环境输入', '数据集与特征工程处理方法', '核心算法基线', '物理机制融合点',
                  '性能提升幅度', '业务映射'].includes(name)) {
        // 长文本列：截断 + tooltip
        base.minWidth = 200; base.flex = 2;
        base.maxWidth = 360;
        base.cellStyle = {
          'white-space': 'nowrap',
          'overflow': 'hidden',
          'text-overflow': 'ellipsis',
        };
      } else {
        base.minWidth = 100; base.flex = 1;
      }

      return base;
    });
}

// ── 列筛选 Popover ──
function toggleColFilter() {
  const pop = document.getElementById('col-filter-popover');
  const btn = document.getElementById('col-filter-btn');
  const isOpen = pop.classList.contains('open');
  if (isOpen) {
    pop.classList.remove('open');
    btn.classList.remove('active');
  } else {
    buildColList('');
    document.getElementById('col-filter-search').value = '';
    pop.classList.add('open');
    btn.classList.add('active');
  }
}

function buildColList(keyword) {
  if (!gridApi) return;
  const cols = gridApi.getColumns() || [];
  const list = document.getElementById('col-filter-list');
  const kw = keyword.trim().toLowerCase();
  const filtered = cols.filter(c => {
    const name = c.getColDef().headerName || c.getColId();
    return !kw || name.toLowerCase().includes(kw);
  });
  if (!filtered.length) {
    list.innerHTML = '<div class="col-filter-empty">无匹配列</div>';
    return;
  }
  list.innerHTML = filtered.map(c => {
    const id = c.getColId();
    const name = c.getColDef().headerName || id;
    const visible = c.isVisible();
    return `<label class="col-filter-item">
      <input type="checkbox" ${visible ? 'checked' : ''} onchange="toggleCol('${id}', this.checked)">
      <span class="col-filter-item-label" title="${name}">${name}</span>
    </label>`;
  }).join('');
}

function toggleCol(colId, visible) {
  if (!gridApi) return;
  gridApi.setColumnVisible(colId, visible);
  updateHiddenBadge();
}

function updateHiddenBadge() {
  if (!gridApi) return;
  const cols = gridApi.getColumns() || [];
  const hiddenCount = cols.filter(c => !c.isVisible()).length;
  const badge = document.getElementById('col-hidden-badge');
  if (hiddenCount > 0) {
    badge.textContent = hiddenCount;
    badge.style.display = 'inline-flex';
  } else {
    badge.style.display = 'none';
  }
}

function resetColVisibility() {
  if (!gridApi) return;
  const cols = gridApi.getColumns() || [];
  cols.forEach(c => gridApi.setColumnVisible(c.getColId(), true));
  buildColList(document.getElementById('col-filter-search').value);
  updateHiddenBadge();
}

function filterColList(kw) {
  buildColList(kw);
}

// 点击外部关闭 Popover
document.addEventListener('click', function(e) {
  const wrap = document.getElementById('col-filter-wrap');
  if (wrap && !wrap.contains(e.target)) {
    document.getElementById('col-filter-popover').classList.remove('open');
    document.getElementById('col-filter-btn').classList.remove('active');
  }
});

// ── 生成本体弹窗 ──
function openOntologyModal() {
  document.getElementById('ontology-modal-overlay').classList.add('active');
}
function closeOntologyModal() {
  document.getElementById('ontology-modal-overlay').classList.remove('active');
}
function confirmOntology() {
  const name = document.getElementById('onto-name').value.trim();
  if (!name) {
    document.getElementById('onto-name').focus();
    document.getElementById('onto-name').style.borderColor = '#ef4444';
    return;
  }
  gotoExternal('graph.html');
}
// 点击遮罩关闭
document.getElementById('ontology-modal-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeOntologyModal();
});

// ── 渲染 Grid ──
function renderGrid(sheetIndex) {
  const sheetName = SHEET_NAMES[sheetIndex];
  const { headers, rows } = INDUSTRY_INSIGHTS_DATA[sheetName];
  const colDefs = buildColDefs(sheetName, headers);

  document.getElementById('row-count').textContent = rows.length;
  document.getElementById('search-input').value = '';
  // 切换 Sheet：关闭 Popover、重置 badge
  document.getElementById('col-filter-popover').classList.remove('open');
  document.getElementById('col-filter-btn').classList.remove('active');
  document.getElementById('col-hidden-badge').style.display = 'none';

  if (gridApi) {
    gridApi.destroy();
    gridApi = null;
  }

  const el = document.getElementById('myGrid');
  gridApi = agGrid.createGrid(el, {
    columnDefs: colDefs,
    rowData: rows,
    defaultColDef: {
      resizable: true,
      sortable: true,
      filter: true,
      tooltipShowDelay: 300,
      tooltipHideDelay: 5000,
    },
    tooltipShowDelay: 300,
    tooltipInteraction: true,
    animateRows: false,
    pagination: rows.length > 200,
    paginationPageSize: 100,
    paginationPageSizeSelector: [50, 100, 200],
    rowBuffer: 20,
    getRowId: params => String(params.data['ID'] || params.data['论文ID'] || params.data['序号'] || Math.random()),
    onFilterChanged: () => {
      document.getElementById('row-count').textContent = gridApi.getDisplayedRowCount();
    },
  });
}

// ── 渲染 Tab 栏 ──
function renderTabs() {
  const container = document.getElementById('sheet-tabs');
  container.innerHTML = '';
  SHEET_NAMES.forEach((name, idx) => {
    const { rows } = INDUSTRY_INSIGHTS_DATA[name];
    const label = SHEET_LABELS[name] || name;
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
    btn.innerHTML = `${label}<span class="tab-count">${rows.length}</span>`;
    btn.onclick = () => switchTab(idx);
    container.appendChild(btn);
  });
}

// ── 切换 Tab ──
function switchTab(idx) {
  if (idx === currentSheet) return;
  currentSheet = idx;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });
  renderGrid(idx);
}

// ── 搜索 ──
function onSearch(val) {
  if (!gridApi) return;
  gridApi.setGridOption('quickFilterText', val);
  setTimeout(() => {
    document.getElementById('row-count').textContent = gridApi.getDisplayedRowCount();
  }, 50);
}

// ── 导出 CSV ──
function exportCSV() {
  if (!gridApi) return;
  gridApi.exportDataAsCsv({ fileName: `${SHEET_NAMES[currentSheet]}.csv` });
}

// ── 初始化 ──
renderTabs();
renderGrid(0);
document.getElementById('loading').style.display = 'none';
</script>
